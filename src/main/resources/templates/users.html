<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>Danh sách Tài khoản</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Quản lý Giáo viên — ĐH Thăng Long</div>
        <div class="nav-right">
            <span>Xin chào, <strong th:text="${loggedUser.username}">admin</strong></span>
            <span class="role-badge" th:classappend="${userRole == 'ADMIN'} ? 'admin' : ''" th:text="${userRole}">ROLE</span>
            <a href="/logout" class="logout-btn">Đăng xuất</a>
        </div>
    </nav>
    <div class="content">
        <h1>Quản lý Tài khoản</h1>
        <!-- Trang Tài khoản chỉ ADMIN mới vào được (đã chặn ở menu trang chủ) -->
        <a href="/users/new" class="add-btn">+ Thêm tài khoản mới</a>
        <a href="/" class="back-btn">Trang chủ</a>
        <div class="search-container">
            <form th:action="@{/users}" method="get">
                <input type="text" name="search" th:value="${search}" placeholder="Tên đăng nhập hoặc email..." class="search-input">
                <button type="submit" class="search-btn">Tìm kiếm</button>
                <a th:if="${search != null and search != ''}" href="/users" class="clear-btn">Hủy</a>
            </form>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mã tài khoản</th>
                    <th>Tên đăng nhập</th>
                    <th>Email</th>
                    <th>Quyền hạn</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${list}">
                    <td th:text="${item.userId}"></td>
                    <td th:text="${item.username}"></td>
                    <td th:text="${item.email}"></td>
                    <td th:text="${item.roleName}"></td>
                    <!-- Hiển thị màu khác nhau tùy trạng thái tài khoản -->
                    <td>
                        <span th:if="${item.status}" class="status-active">✔ Đang hoạt động</span>
                        <span th:unless="${item.status}" class="status-locked">✖ Đã khóa</span>
                    </td>
                    <td th:text="${item.createDate}"></td>
                    <td>
                        <a th:href="@{/users/delete/{id}(id=${item.userId})}"
                           class="delete-btn"
                           onclick="return confirm('Bạn có chắc muốn xóa tài khoản này?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
