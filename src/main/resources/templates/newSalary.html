<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Chốt lương tháng</title>
</head>
<body>
    <div class="content">
        <h1>Chốt lương tháng giảng viên</h1>
        <h2>Hệ thống tự động tính toán tổng thực nhận dựa trên lương cơ bản</h2>
        
        <form th:action="@{/salarys/save}" th:object="${obj}" method="post">
            <div class="form-group">
                <label>Mã bản ghi lương (ID):</label>
                <input type="text" th:field="*{salaryId}" placeholder="Ví dụ: L2026_06_01" required />
            </div>
            
            <div class="form-group">
                <label>Chọn giảng viên:</label>
                <!-- Đổi sang dropdown select danh sách giảng viên -->
                <select th:field="*{teacherId}" id="teacherSelect" onchange="calculateTotal()" required>
                    <option value="">-- Chọn giảng viên --</option>
                    <option th:each="t : ${teachers}" 
                            th:value="${t.teacherId}" 
                            th:data-salary="${t.salary}" 
                            th:text="${t.name} + ' (Lương gốc: ' + ${#numbers.formatDecimal(t.salary, 0, 'COMMA', 0, 'POINT')} + 'đ)'">
                    </option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Tháng (1-12):</label>
                <input type="number" th:field="*{month}" min="1" max="12" required />
            </div>
            <div class="form-group">
                <label>Năm:</label>
                <input type="number" th:field="*{year}" required />
            </div>
            <div class="form-group">
                <label>Tổng số giờ dạy thực tế:</label>
                <input type="number" step="0.1" th:field="*{totalHours}" required />
            </div>
            
            <div class="form-group">
                <label>Tiền thưởng thêm (Phụ cấp):</label>
                <input type="number" th:field="*{bonus}" id="bonusInput" oninput="calculateTotal()" value="0" />
            </div>
            
            <div class="form-group">
                <label>Tiền khấu trừ (Phạt):</label>
                <input type="number" th:field="*{deduction}" id="deductionInput" oninput="calculateTotal()" value="0" />
            </div>
            
            <div class="form-group">
                <label>Tổng thực nhận (Tính tự động):</label>
                <!-- Đổi thành readonly để người dùng không sửa tay, bắt buộc hệ thống tính -->
                <input type="number" th:field="*{totalSalary}" id="totalSalaryInput" readonly required />
            </div>
            
            <button type="submit">Chốt lương</button>
        </form>
        
        <hr>
        <a href="/salarys" class="back-link">Quay lại danh sách</a>
    </div>

    <!-- Đoạn mã Script tự động tính toán nhanh ngoài giao diện -->
    <script>
        function calculateTotal() {
            var select = document.getElementById("teacherSelect");
            var selectedOption = select.options[select.selectedIndex];
            
            // Lấy lương cơ bản của giáo viên được lưu ở data-salary
            var baseSalary = 0;
            if (selectedOption && selectedOption.getAttribute("data-salary")) {
                baseSalary = parseFloat(selectedOption.getAttribute("data-salary"));
            }
            
            var bonusInput = document.getElementById("bonusInput");
            var deductionInput = document.getElementById("deductionInput");
            var totalSalaryInput = document.getElementById("totalSalaryInput");
            
            // Nếu người dùng không nhập thì mặc định là 0
            var bonus = parseFloat(bonusInput.value) || 0;
            var deduction = parseFloat(deductionInput.value) || 0;
            
            // Công thức: Thực nhận = Lương cơ bản + Thưởng - Phạt
            var total = baseSalary + bonus - deduction;
            if (total < 0) {
                total = 0;
            }
            
            // Gán kết quả vào ô Tổng thực nhận
            totalSalaryInput.value = Math.round(total);
        }
    </script>
</body>
</html>
