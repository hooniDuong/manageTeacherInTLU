<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Khoa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Quản lý Giáo viên — ĐH Thăng Long</div>
        <div class="nav-right">
            <span>Xin chào, <strong th:text="${loggedUser.username}">admin</strong></span>
            <span class="role-badge" th:classappend="${userRole == 'ADMIN'} ? 'admin' : ''" th:text="${userRole}">ROLE</span>
            <a href="/logout" class="logout-btn">Đăng xuất</a>
        </div>
    </nav>
    <div class="content">
        <h1>Quản lý Khoa</h1>
        <a href="/facultys/new" class="add-btn" th:if="${userRole == 'ADMIN'}">Thêm mới</a>
        <a href="/" class="back-btn">Trang chủ</a>
        <div class="search-container">
            <form th:action="@{/facultys}" method="get">
                <input type="text" name="search" th:value="${search}" placeholder="Tìm kiếm theo tên khoa..." class="search-input">
                <button type="submit" class="search-btn">Tìm kiếm</button>
                <a th:if="${search != null and search != ''}" href="/facultys" class="clear-btn">Hủy</a>
            </form>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mã khoa</th>
                    <th>Tên khoa</th>
                    <th>Mô tả</th>
                    <th th:if="${userRole == 'ADMIN'}">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${list}">
                    <td th:text="${item.facultyId}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.description}"></td>
                    <td th:if="${userRole == 'ADMIN'}">
                        <a th:href="@{/facultys/delete/{id}(id=${item.facultyId})}"
                           class="delete-btn"
                           onclick="return confirm('Bạn có chắc muốn xóa khoa này?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
