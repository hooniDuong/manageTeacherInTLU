<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Thêm mới Học kỳ</title>
</head>
<body>
    <h1>Thêm mới Học kỳ</h1>
    <form th:action="@{/semesters/save}" th:object="${obj}" method="post">
        <div class="form-group">
            <label>Mã học kỳ (ID):</label>
            <input type="text" th:field="*{semesterId}" required />
        </div>
        <div class="form-group">
            <label>Tên học kỳ:</label>
            <select th:field="*{name}">
                <option value="Học kỳ I">Học kỳ I</option>
                <option value="Học kỳ II">Học kỳ II</option>
                <option value="Học kỳ phụ">Học kỳ phụ (Hè)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Năm học:</label>
            <input type="number" th:field="*{year}" required />
        </div>
        <div class="form-group">
            <label>Ngày bắt đầu:</label>
            <input type="date" th:field="*{startDate}" required />
        </div>
        <div class="form-group">
            <label>Ngày kết thúc:</label>
            <input type="date" th:field="*{endDate}" required />
        </div>
        <button type="submit">Lưu lại</button>
    </form>
    <a href="/semesters" class="back-link">Quay lại danh sách</a>
</body>
</html>
