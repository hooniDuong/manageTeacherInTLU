<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phân công Giảng dạy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Quản lý Giáo viên — ĐH Thăng Long</div>
        <div class="nav-right">
            <span>Xin chào, <strong th:text="${loggedUser.username}">admin</strong></span>
            <span class="role-badge" th:classappend="${userRole == 'ADMIN'} ? 'admin' : ''" th:text="${userRole}">ROLE</span>
            <a href="/logout" class="logout-btn">Đăng xuất</a>
        </div>
    </nav>
    <div class="content">
        <h1>Phân công Giảng dạy</h1>
        <a href="/teachingassignments/new" class="add-btn" th:if="${userRole == 'ADMIN'}">Thêm mới</a>
        <a href="/" class="back-btn">Trang chủ</a>
        <div class="search-container">
            <form th:action="@{/teachingassignments}" method="get">
                <input type="text" name="search" th:value="${search}" placeholder="Tên GV, môn học, mã phân công..." class="search-input">
                <button type="submit" class="search-btn">Tìm kiếm</button>
                <a th:if="${search != null and search != ''}" href="/teachingassignments" class="clear-btn">Hủy</a>
            </form>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mã phân công</th>
                    <th>Giảng viên</th>
                    <th>Môn học</th>
                    <th>Lớp học</th>
                    <th>Phòng học</th>
                    <th>Học kỳ</th>
                    <th>Số giờ</th>
                    <th>Lịch học</th>
                    <th>Trạng thái</th>
                    <th th:if="${userRole == 'ADMIN'}">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${list}">
                    <td th:text="${item.assignmentId}"></td>
                    <td th:text="${item.teacherName}"></td>
                    <td th:text="${item.subjectName}"></td>
                    <td th:text="${item.studentClassName}"></td>
                    <td th:text="${item.classroomName}"></td>
                    <td th:text="${item.semesterName}"></td>
                    <td th:text="${item.hours}"></td>
                    <td th:text="${item.schedule}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:if="${userRole == 'ADMIN'}">
                        <a th:href="@{/teachingassignments/delete/{id}(id=${item.assignmentId})}"
                           class="delete-btn"
                           onclick="return confirm('Bạn có chắc muốn xóa phân công này?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
