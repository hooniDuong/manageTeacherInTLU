<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>Danh sách Lương</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Quản lý Giáo viên — ĐH Thăng Long</div>
        <div class="nav-right">
            <span>Xin chào, <strong th:text="${loggedUser.username}">admin</strong></span>
            <span class="role-badge" th:classappend="${userRole == 'ADMIN'} ? 'admin' : ''" th:text="${userRole}">ROLE</span>
            <a href="/logout" class="logout-btn">Đăng xuất</a>
        </div>
    </nav>
    <div class="content">
        <h1>Quản lý Lương</h1>
        <a href="/salarys/new" class="add-btn" th:if="${userRole == 'ADMIN'}">+ Chốt lương tháng mới</a>
        <a href="/" class="back-btn">Trang chủ</a>
        <div class="search-container">
            <form th:action="@{/salarys}" method="get">
                <input type="text" name="search" th:value="${search}" placeholder="Tên giảng viên hoặc mã lương..." class="search-input">
                <button type="submit" class="search-btn">Tìm kiếm</button>
                <a th:if="${search != null and search != ''}" href="/salarys" class="clear-btn">Hủy</a>
            </form>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mã lương</th>
                    <th>Giảng viên</th>
                    <th>Tháng/Năm</th>
                    <th>Tổng số giờ dạy</th>
                    <th>Tiền thưởng</th>
                    <th>Khoản khấu trừ</th>
                    <th>Tổng nhận</th>
                    <th>Ngày chốt</th>
                    <th th:if="${userRole == 'ADMIN'}">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${list}">
                    <td th:text="${item.salaryId}"></td>
                    <td th:text="${item.teacherName}"></td>
                    <td th:text="${item.month + '/' + item.year}"></td>
                    <td th:text="${item.totalHours}"></td>
                    <td th:text="${#numbers.formatDecimal(item.bonus, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${#numbers.formatDecimal(item.deduction, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="total-col" th:text="${#numbers.formatDecimal(item.totalSalary, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${item.createDate}"></td>
                    <td th:if="${userRole == 'ADMIN'}">
                        <a th:href="@{/salarys/delete/{id}(id=${item.salaryId})}"
                           class="delete-btn"
                           onclick="return confirm('Bạn có chắc muốn xóa bảng lương này?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
