<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm mới Khoa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Thêm mới Khoa (Faculty)</h1>
    <form th:action="@{/facultys/save}" th:object="${obj}" method="post">
        <div class="form-group">
            <label>Mã Khoa (ID):</label>
            <input type="text" th:field="*{facultyId}" required />
        </div>
        <div class="form-group">
            <label>Tên khoa:</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <div class="form-group">
            <label>Mô tả:</label>
            <textarea th:field="*{description}" rows="3"></textarea>
        </div>
        <button type="submit">Lưu lại</button>
    </form>
    <a href="/facultys" class="back-link">Quay lại danh sách</a>
</body>
</html>
