<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm mới Lớp sinh viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Thêm mới Lớp sinh viên (StudentClass)</h1>
    <form th:action="@{/studentclasss/save}" th:object="${obj}" method="post">
        <div class="form-group">
            <label>Mã lớp học (ID):</label>
            <input type="text" th:field="*{classId}" required />
        </div>
        <div class="form-group">
            <label>Tên lớp:</label>
            <input type="text" th:field="*{name}" required />
        </div>
        <div class="form-group">
            <label>Chuyên ngành:</label>
            <input type="text" th:field="*{major}" required />
        </div>
        <div class="form-group">
            <label>Năm nhập học (Khóa):</label>
            <input type="number" th:field="*{enrollmentYear}" required />
        </div>
        <div class="form-group">
            <label>Mã Khoa trực thuộc (Faculty ID):</label>
            <input type="text" th:field="*{facultyId}" required />
        </div>
        <button type="submit">Lưu lại</button>
    </form>
    <a href="/studentclasss" class="back-link">Quay lại danh sách</a>
</body>
</html>
