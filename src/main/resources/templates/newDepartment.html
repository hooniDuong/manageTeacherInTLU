<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới Bộ Môn</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="content">
        <h1>Thêm mới Bộ Môn (Department)</h1>
        <form th:action="@{/departments/save}" th:object="${obj}" method="post">
            <div class="form-group">
                <label>Mã Bộ Môn (ID):</label>
                <input type="text" th:field="*{departmentId}" required />
            </div>
            <div class="form-group">
                <label>Tên Bộ Môn:</label>
                <input type="text" th:field="*{name}" required />
            </div>
            <div class="form-group">
                <label>Vị trí văn phòng:</label>
                <input type="text" th:field="*{locationOffice}" />
            </div>
            <div class="form-group">
                <label>Mô tả:</label>
                <textarea th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Mã Khoa quản lý (Faculty ID):</label>
                <input type="text" th:field="*{facultyId}" required />
            </div>
            <button type="submit">Lưu lại</button>
        </form>
        <hr>
        <a href="/departments" class="back-link">Quay lại danh sách</a>
    </div>
</body>
</html>
